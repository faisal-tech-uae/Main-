name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://resumeai:resumeai@localhost:5432/resumeai_pro_test
  # Next.js statically renders pages that read the Clerk publishable key at
  # build time, so CI needs a syntactically valid placeholder even though no
  # real Clerk project is configured for this pipeline.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
  CLERK_SECRET_KEY: sk_test_placeholder

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resumeai
          POSTGRES_PASSWORD: resumeai
          POSTGRES_DB: resumeai_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumeai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @resumeai/db run generate

      - name: Run migrations
        run: pnpm --filter @resumeai/db exec prisma migrate deploy

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Build
        run: pnpm run build
